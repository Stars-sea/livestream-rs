name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-D warnings"

jobs:
    ci:
        name: Lint + Test + Build
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential clang libclang-dev pkg-config \
                    libssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
                    protobuf-compiler ffmpeg

            - name: Install Rust toolchain
              # pinned to the stable branch tip (dtolnay/rust-toolchain@stable)
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
              with:
                  components: rustfmt, clippy

            - name: Rust cache
              # pinned to the v2 tag (Swatinem/rust-cache@v2)
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --workspace

            - name: Build release
              run: cargo build --release

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image (official sources)
              # 推送到 GHCR 供主仓库（Makerverse）CI 直接拉取（AppHostFixture
              # RemoveDockerfileBuildInCi 复用 livestream-svc:latest）。按 commit SHA 精确 tag，
              # 避免 :latest 漂移；仅 push 事件推送（fork PR 的 GITHUB_TOKEN 无写权限）。
              uses: docker/build-push-action@v6
              with:
                  build-args: USE_MIRROR=false
                  tags: ghcr.io/stars-sea/livestream-svc:${{ github.sha }}
                  push: ${{ github.event_name == 'push' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: E2E test (stress)
              run: bash scripts/e2e-test.sh
