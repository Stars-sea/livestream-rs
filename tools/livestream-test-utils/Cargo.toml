[package]
name = "livestream-test-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"
