[package]
name = "livestream-rs"
version = "0.3.1"
edition = "2024"

[features]
default = ["opentelemetry"]
opentelemetry = [
	"dep:opentelemetry",
	"dep:opentelemetry_sdk",
	"dep:opentelemetry-otlp",
	"dep:opentelemetry-appender-tracing",
	"dep:tracing-opentelemetry",
]

[dependencies]
anyhow = "1.0.104"
ffmpeg-sys-next = { version = "8.1.0", default-features = false, features = ["avcodec", "avformat"] }
minio = "0.4.0"
prost = "0.14.4"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
regex = "1.13.1"
rml_rtmp = "0.8.0"
bytes = "1.12.1"
tempfile = "3.27.0"
config = "0.15.25"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace", "metrics", "logs", "internal-logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
retry = "2.2.0"
dashmap = "6.2.1"
tokio-util = { version = "0.7.19", features = ["full"] }
crossfire = { version = "3.1.19", features = ["tokio"] }
async-trait = "0.1.91"
async-stream = "0.3.6"
axum = "0.8.9"
parking_lot = "0.12.5"

[build-dependencies]
tonic-prost-build = "0.14.6"
